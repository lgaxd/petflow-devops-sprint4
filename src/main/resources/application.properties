spring.application.name=petflow-api
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (Azure Database for PostgreSQL Flexible Server em produção)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Cache
spring.cache.type=simple

# Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# Paginação padrão
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Tempo máximo de uma sessão renovada via /auth/refresh (padrão: 7 dias)
jwt.max-session-ms=${JWT_MAX_SESSION_MS:604800000}
server.port=${PORT:8080}
# Atrás do proxy do App Service (TLS terminado nele): respeita X-Forwarded-Proto/Host,
# para o Swagger anunciar https e o HSTS ser enviado
server.forward-headers-strategy=framework

# Observabilidade (Actuator): apenas health/info, detalhes ocultos para anônimos
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.br.com.petflow=INFO
